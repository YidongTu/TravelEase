<svg width="800" height="400" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景和标题 -->
  <rect width="100%" height="100%" fill="#f9f9f9" rx="10" ry="10"/>
  <text x="400" y="30" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle">分布式爬虫技术流程图</text>
  
  <!-- 主要流程节点 -->
  <rect x="100" y="100" width="150" height="80" rx="10" ry="10" fill="#e3f2fd" stroke="#2196f3" stroke-width="2"/>
  <text x="175" y="130" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">多线程爬取</text>
  <text x="175" y="155" font-family="Arial" font-size="12" text-anchor="middle">CtripScenicSpotCrawler</text>
  <text x="175" y="175" font-family="Arial" font-size="12" text-anchor="middle">crawl_city_spots()</text>
  
  <rect x="325" y="100" width="150" height="80" rx="10" ry="10" fill="#e8f5e9" stroke="#4caf50" stroke-width="2"/>
  <text x="400" y="130" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">数据清洗</text>
  <text x="400" y="155" font-family="Arial" font-size="12" text-anchor="middle">去重处理</text>
  <text x="400" y="175" font-family="Arial" font-size="12" text-anchor="middle">数据格式化</text>
  
  <rect x="550" y="100" width="150" height="80" rx="10" ry="10" fill="#fff3e0" stroke="#ff9800" stroke-width="2"/>
  <text x="625" y="130" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">标准化存储</text>
  <text x="625" y="155" font-family="Arial" font-size="12" text-anchor="middle">数据库存储</text>
  <text x="625" y="175" font-family="Arial" font-size="12" text-anchor="middle">Attraction模型</text>
  
  <!-- 定期更新节点 -->
  <rect x="325" y="250" width="150" height="80" rx="10" ry="10" fill="#f3e5f5" stroke="#9c27b0" stroke-width="2"/>
  <text x="400" y="280" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">定期更新</text>
  <text x="400" y="305" font-family="Arial" font-size="12" text-anchor="middle">定时任务</text>
  <text x="400" y="325" font-family="Arial" font-size="12" text-anchor="middle">刷新数据</text>
  
  <!-- 箭头 -->
  <line x1="250" y1="140" x2="325" y2="140" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="475" y1="140" x2="550" y2="140" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="625" y1="180" x2="625" y2="250" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="475" y1="180" x2="475" y2="250" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="400" y1="330" x2="400" y2="360" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="400" y1="360" x2="175" y2="360" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="175" y1="360" x2="175" y2="180" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- 数据更新周期说明 -->
  <rect x="100" y="250" width="200" height="80" rx="10" ry="10" fill="#ffebee" stroke="#f44336" stroke-width="2"/>
  <text x="200" y="280" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">数据更新周期</text>
  <text x="200" y="305" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">每日 1 次</text>
  <text x="200" y="325" font-family="Arial" font-size="12" text-anchor="middle">确保景点信息实时准确</text>
  
  <!-- 箭头标记 -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>
</svg>