<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>旅游推荐 - 注册</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="auth-card">
            <div class="auth-header">
                <h1>旅游推荐</h1>
                <p>探索世界，发现美好</p>
            </div>
            
            <div class="auth-form">
                <h2>注册</h2>
                <form id="registerForm">
                    <div class="form-group">
                        <label for="register-name"><i class="fas fa-user"></i> 姓名</label>
                        <input type="text" id="register-name" required>
                    </div>
                    <div class="form-group">
                        <label for="register-email"><i class="fas fa-envelope"></i> 邮箱</label>
                        <input type="email" id="register-email" required>
                    </div>
                    <div class="form-group">
                        <label for="register-password"><i class="fas fa-lock"></i> 密码</label>
                        <input type="password" id="register-password" required>
                    </div>
                    <div class="form-group">
                        <label for="register-confirm"><i class="fas fa-lock"></i> 确认密码</label>
                        <input type="password" id="register-confirm" required>
                    </div>
                    <button type="submit" class="btn-primary">注册</button>
                </form>
                <p class="auth-switch">已有账号？<a href="index.html">立即登录</a></p>
            </div>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
